<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">Hoax Hunter workflow</title>
  <desc id="d">A pasted message is checked by the red-flag rules and the machine-learning model in parallel. The scorer blends both into a 0-100 score and a verdict, which the app shows with evidence, highlights and advice.</desc>
  <style>
    text { font-family: Georgia, "Times New Roman", serif; fill: #1c1b18; }
    .bg { fill: #f6f2e9; stroke: #1c1b18; stroke-width: 2; }
    .box { fill: #fffdf8; stroke: #1c1b18; stroke-width: 2; }
    .hot { stroke: #c0391a; stroke-width: 2.5; }
    .h { font-size: 13px; font-weight: 700; fill: #c0391a; }
    .t { font-size: 18px; font-weight: 700; }
    .s { font-size: 12px; fill: #6a655a; font-family: Consolas, "Courier New", monospace; }
    .b { font-size: 12.5px; fill: #34312a; }
    .m { font-family: Consolas, "Courier New", monospace; font-size: 15px; font-weight: 700; }
    .out { font-size: 12.5px; font-weight: 700; fill: #c0391a; }
    .arrow { fill: none; stroke: #1c1b18; stroke-width: 2; }
    .chip { stroke-width: 2; }
    .ct { font-size: 14px; font-weight: 700; }
    .cs { font-size: 12.5px; fill: #34312a; }
    .note { font-size: 12.5px; fill: #5b564a; font-style: italic; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1c1b18"/>
    </marker>
  </defs>

  <rect class="bg" x="1" y="1" width="1198" height="638"/>
  <text x="30" y="42" style="font-size:22px;font-weight:600;font-style:italic">How Hoax Hunter looks at a message</text>

  <!-- 1 Input -->
  <rect class="box hot" x="30" y="260" width="180" height="130"/>
  <text class="h" x="46" y="288">1. You paste it</text>
  <text class="t" x="46" y="314">The message</text>
  <text class="b" x="46" y="338">SMS, WhatsApp or</text>
  <text class="b" x="46" y="356">e-mail text</text>
  <text class="s" x="46" y="378">app.py</text>

  <!-- 2a Rules -->
  <rect class="box" x="280" y="64" width="320" height="240"/>
  <text class="h" x="298" y="92">2a. The red-flag rules</text>
  <text class="s" x="298" y="110">src/rules.py</text>
  <text class="b" x="298" y="140">• Urgency, threats, "account will be blocked"</text>
  <text class="b" x="298" y="162">• Asks to share OTP / PIN / CVV</text>
  <text class="b" x="298" y="184">• Fake prizes, loans, jobs, upfront fees</text>
  <text class="b" x="298" y="206">• Fake delivery problems, impersonation</text>
  <text class="b" x="298" y="228">• Link check: lookalike bank domains,</text>
  <text class="b" x="298" y="246">   shorteners, odd endings like .xyz</text>
  <line x1="298" y1="262" x2="582" y2="262" stroke="#cdc4b0" stroke-width="1.5"/>
  <text class="out" x="298" y="288">→ rule score 0-100, plus the reasons</text>

  <!-- 2b Model -->
  <rect class="box" x="280" y="336" width="320" height="250"/>
  <text class="h" x="298" y="364">2b. The learning model</text>
  <text class="s" x="298" y="382">src/model.py</text>
  <text class="b" x="298" y="412">• Clean the text: links, amounts and</text>
  <text class="b" x="298" y="430">   numbers become neutral tokens</text>
  <text class="b" x="298" y="454">• TF-IDF features: words + character</text>
  <text class="b" x="298" y="472">   n-grams</text>
  <text class="b" x="298" y="496">• Logistic Regression classifier</text>
  <text class="b" x="298" y="520">• Mostly non-Latin text (e.g. Hindi)</text>
  <text class="b" x="298" y="538">   skips the model: it only knows English</text>
  <line x1="298" y1="550" x2="582" y2="550" stroke="#cdc4b0" stroke-width="1.5"/>
  <text class="out" x="298" y="572">→ scam probability 0-100%</text>

  <!-- 3 Scorer -->
  <rect class="box hot" x="670" y="190" width="220" height="270"/>
  <text class="h" x="688" y="218">3. The scorer</text>
  <text class="s" x="688" y="236">src/scorer.py</text>
  <text class="m" x="688" y="274">score = 60% model</text>
  <text class="m" x="742" y="296">+ 40% rules</text>
  <text class="b" x="688" y="332">Very strong signals are not</text>
  <text class="b" x="688" y="350">diluted by the weaker one.</text>
  <text class="b" x="688" y="380">A critical flag (share your</text>
  <text class="b" x="688" y="398">OTP, or a fake bank site)</text>
  <text class="b" x="688" y="416">forces Likely Scam (65+).</text>

  <!-- 4 Verdict -->
  <rect class="box" x="960" y="64" width="210" height="240"/>
  <text class="h" x="978" y="92">4. The verdict</text>
  <rect class="chip" x="978" y="106" width="174" height="36" fill="#dcebdc" stroke="#1f6b45"/>
  <text class="ct" x="990" y="129" style="fill:#1f6b45">Safe</text>
  <text class="cs" x="1140" y="129" text-anchor="end">below 35</text>
  <rect class="chip" x="978" y="150" width="174" height="36" fill="#f7e7b8" stroke="#7d5300"/>
  <text class="ct" x="990" y="173" style="fill:#7d5300">Suspicious</text>
  <text class="cs" x="1140" y="173" text-anchor="end">35 to 64</text>
  <rect class="chip" x="978" y="194" width="174" height="36" fill="#f5d9d2" stroke="#a3271a"/>
  <text class="ct" x="990" y="217" style="fill:#a3271a">Likely Scam</text>
  <text class="cs" x="1140" y="217" text-anchor="end">65+</text>
  <rect class="chip" x="978" y="238" width="174" height="36" fill="#e6e2d7" stroke="#3f3d38"/>
  <text class="ct" x="990" y="261" style="fill:#3f3d38">Can't judge</text>
  <text class="cs" x="1140" y="261" text-anchor="end">no score</text>
  <text class="note" x="978" y="294">Never "Safe" for unreadable text</text>

  <!-- 5 Output -->
  <rect class="box hot" x="960" y="336" width="210" height="250"/>
  <text class="h" x="978" y="364">5. What you see</text>
  <text class="s" x="978" y="382">src/ui.py</text>
  <text class="b" x="978" y="412">• Risk score and verdict</text>
  <text class="b" x="978" y="440">• Why: each red flag and</text>
  <text class="b" x="978" y="458">   what it means</text>
  <text class="b" x="978" y="486">• Your message, with the</text>
  <text class="b" x="978" y="504">   suspicious words marked</text>
  <text class="b" x="978" y="532">• What to do now, and how</text>
  <text class="b" x="978" y="550">   to report it (call 1930)</text>

  <!-- arrows -->
  <path class="arrow" d="M210 325 H245 V184 H278" marker-end="url(#ah)"/>
  <path class="arrow" d="M245 325 V461 H278" marker-end="url(#ah)"/>
  <path class="arrow" d="M600 184 H635 V290 H668" marker-end="url(#ah)"/>
  <path class="arrow" d="M600 461 H635 V360 H668" marker-end="url(#ah)"/>
  <path class="arrow" d="M890 325 H925 V184 H958" marker-end="url(#ah)"/>
  <path class="arrow" d="M925 325 V461 H958" marker-end="url(#ah)"/>

  <text class="note" x="600" y="622" text-anchor="middle">Everything runs on your own computer. Nothing you paste is saved.</text>
</svg>
