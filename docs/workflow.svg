<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">Hoax Hunter workflow</title>
  <desc id="d">A pasted message is checked by the red-flag rules and the machine-learning model in parallel. The scorer blends both into a 0-100 score and a verdict, which the app shows with evidence, highlights and advice.</desc>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #ece7dd; }
    .bg { fill: #0a0a0c; }
    .box { fill: #121216; stroke: #2c2c34; stroke-width: 1.5; }
    .gold { stroke: #d4af6e; }
    .h { font-size: 12px; font-weight: 700; letter-spacing: .12em; fill: #d4af6e; }
    .t { font-size: 17px; font-weight: 700; }
    .s { font-size: 12px; fill: #8e8a80; font-family: Consolas, "Courier New", monospace; }
    .b { font-size: 13px; fill: #cfcac0; }
    .m { font-family: Consolas, "Courier New", monospace; font-size: 15px; fill: #f2dca5; }
    .out { font-size: 12.5px; font-weight: 600; fill: #d4af6e; }
    .arrow { fill: none; stroke: #d4af6e; stroke-width: 2; }
    .chip { stroke-width: 1.5; }
    .ct { font-size: 14px; font-weight: 700; }
    .cs { font-size: 12.5px; }
    .note { font-size: 12.5px; fill: #8e8a80; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d4af6e"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="640" rx="18"/>
  <text x="30" y="40" style="font-size:21px;font-weight:700;fill:#d4af6e">How Hoax Hunter analyses a message</text>

  <!-- 1 Input -->
  <rect class="box gold" x="30" y="260" width="180" height="130" rx="14"/>
  <text class="h" x="46" y="288">1 · INPUT</text>
  <text class="t" x="46" y="313">Paste a message</text>
  <text class="b" x="46" y="338">SMS, WhatsApp or</text>
  <text class="b" x="46" y="356">e-mail text</text>
  <text class="s" x="46" y="378">app.py</text>

  <!-- 2a Rules -->
  <rect class="box" x="280" y="64" width="320" height="240" rx="14"/>
  <text class="h" x="298" y="92">2A · RED-FLAG RULES</text>
  <text class="s" x="298" y="110">src/rules.py</text>
  <text class="b" x="298" y="140">• Urgency, threats, "account will be blocked"</text>
  <text class="b" x="298" y="162">• Asks to share OTP / PIN / CVV</text>
  <text class="b" x="298" y="184">• Fake prizes, loans, jobs, upfront fees</text>
  <text class="b" x="298" y="206">• Fake delivery problems, impersonation</text>
  <text class="b" x="298" y="228">• Link check: lookalike bank domains,</text>
  <text class="b" x="298" y="246">   shorteners, suspicious endings (.xyz)</text>
  <line x1="298" y1="262" x2="582" y2="262" stroke="#2c2c34"/>
  <text class="out" x="298" y="288">→ rule score 0-100 + flags with reasons</text>

  <!-- 2b Model -->
  <rect class="box" x="280" y="336" width="320" height="250" rx="14"/>
  <text class="h" x="298" y="364">2B · MACHINE-LEARNING MODEL</text>
  <text class="s" x="298" y="382">src/model.py</text>
  <text class="b" x="298" y="412">• Clean the text: links, amounts and</text>
  <text class="b" x="298" y="430">   numbers become neutral tokens</text>
  <text class="b" x="298" y="454">• TF-IDF features: words + character</text>
  <text class="b" x="298" y="472">   n-grams</text>
  <text class="b" x="298" y="496">• Logistic Regression classifier</text>
  <text class="b" x="298" y="520">• Mostly non-Latin text (e.g. Hindi)</text>
  <text class="b" x="298" y="538">   skips the model: it only knows English</text>
  <line x1="298" y1="550" x2="582" y2="550" stroke="#2c2c34"/>
  <text class="out" x="298" y="572">→ scam probability 0-100%</text>

  <!-- 3 Scorer -->
  <rect class="box gold" x="670" y="190" width="220" height="270" rx="14"/>
  <text class="h" x="688" y="218">3 · SCORER</text>
  <text class="s" x="688" y="236">src/scorer.py</text>
  <text class="m" x="688" y="274">score = 60% model</text>
  <text class="m" x="688" y="296">      + 40% rules</text>
  <text class="b" x="688" y="332">Very strong signals are not</text>
  <text class="b" x="688" y="350">diluted by the weaker one.</text>
  <text class="b" x="688" y="380">A critical flag (share your</text>
  <text class="b" x="688" y="398">OTP, or a fake bank site)</text>
  <text class="b" x="688" y="416">forces Likely Scam (65+).</text>

  <!-- 4 Verdict -->
  <rect class="box" x="960" y="64" width="210" height="240" rx="14"/>
  <text class="h" x="978" y="92">4 · VERDICT</text>
  <rect class="chip" x="978" y="106" width="174" height="36" rx="9" fill="#12261c" stroke="#3f9568"/>
  <text class="ct" x="990" y="129" style="fill:#6fd09b">Safe</text>
  <text class="cs" x="1140" y="129" text-anchor="end" style="fill:#9fd8b8">below 35</text>
  <rect class="chip" x="978" y="150" width="174" height="36" rx="9" fill="#2a2110" stroke="#b9892f"/>
  <text class="ct" x="990" y="173" style="fill:#f0bb55">Suspicious</text>
  <text class="cs" x="1140" y="173" text-anchor="end" style="fill:#e6cd96">35 to 64</text>
  <rect class="chip" x="978" y="194" width="174" height="36" rx="9" fill="#2b1412" stroke="#b9453f"/>
  <text class="ct" x="990" y="217" style="fill:#f0716a">Likely Scam</text>
  <text class="cs" x="1140" y="217" text-anchor="end" style="fill:#ebb1ad">65+</text>
  <rect class="chip" x="978" y="238" width="174" height="36" rx="9" fill="#1b1b20" stroke="#4a4a54"/>
  <text class="ct" x="990" y="261" style="fill:#c9c5ba">Can't judge</text>
  <text class="cs" x="1140" y="261" text-anchor="end" style="fill:#9a958a">unreadable</text>
  <text class="note" x="978" y="294">Never "Safe" for unreadable text</text>

  <!-- 5 Output -->
  <rect class="box gold" x="960" y="336" width="210" height="250" rx="14"/>
  <text class="h" x="978" y="364">5 · WHAT YOU SEE</text>
  <text class="s" x="978" y="382">src/ui.py</text>
  <text class="b" x="978" y="412">• Risk score and verdict</text>
  <text class="b" x="978" y="440">• The evidence: each red</text>
  <text class="b" x="978" y="458">   flag and why it matters</text>
  <text class="b" x="978" y="486">• Your message with the</text>
  <text class="b" x="978" y="504">   suspicious words marked</text>
  <text class="b" x="978" y="532">• What to do next, and how</text>
  <text class="b" x="978" y="550">   to report it (call 1930)</text>

  <!-- arrows -->
  <path class="arrow" d="M210 325 H245 V184 H278" marker-end="url(#ah)"/>
  <path class="arrow" d="M245 325 V461 H278" marker-end="url(#ah)"/>
  <path class="arrow" d="M600 184 H635 V290 H668" marker-end="url(#ah)"/>
  <path class="arrow" d="M600 461 H635 V360 H668" marker-end="url(#ah)"/>
  <path class="arrow" d="M890 325 H925 V184 H958" marker-end="url(#ah)"/>
  <path class="arrow" d="M925 325 V461 H958" marker-end="url(#ah)"/>

  <text class="note" x="600" y="622" text-anchor="middle">Everything runs on your own computer. Nothing you paste is saved.</text>
</svg>
